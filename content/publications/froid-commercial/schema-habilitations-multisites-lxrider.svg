<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
  <title id="title">Habilitations multisites via bastion</title>
  <desc id="desc">Architecture illustrative : un frigoriste identifié rejoint un VPN d'accès avec authentification multifacteur, puis un bastion centralisé. Des tunnels VPN intersites, terminés sur des passerelles, desservent trois magasins dotés de pare-feu locaux. Les sessions de ce technicien sont autorisées pour les magasins A et C, et refusées par le bastion pour le magasin B. Les droits propres aux superviseurs demeurent distincts.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 9 9" refX="7.6" refY="4.5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#71cede" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 9 9" refX="7.6" refY="4.5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#83dbb8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style>
  <rect width="1160" height="700" rx="18" fill="#0a1923"/>
  <rect x="1" y="1" width="1158" height="698" rx="17" fill="none" stroke="#37515b" stroke-width="1.5"/>
  <text x="34" y="42" fill="#71cede" font-size="18" font-weight="700">ACCÈS DISTANTS  /  HABILITATIONS MULTISITES</text>
  <text x="34" y="83" fill="#eff8fa" font-size="29" font-weight="700">Un technicien, des droits différents selon les magasins</text>
  <text x="34" y="112" fill="#b6cbd3" font-size="18">Exemple fictif : la mission autorisée définit les accès aux sites.</text>
  <line x1="34" y1="130" x2="1126" y2="130" stroke="#365461" stroke-width="1.4"/>

  <!-- Identification et parcours du technicien -->
  <rect x="34" y="159" width="306" height="122" rx="12" fill="#0e2833" stroke="#365461" stroke-width="1.5"/>
  <rect x="52" y="177" width="270" height="40" rx="8" fill="#143844"/>
  <text x="187" y="204" text-anchor="middle" fill="#eff8fa" font-size="21" font-weight="700">Technicien frigoriste</text>
  <text x="187" y="247" text-anchor="middle" fill="#b6cbd3" font-size="18">Compte nominatif unique</text>

  <line x1="343" y1="218" x2="398" y2="218" stroke="#71cede" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="410" y="159" width="294" height="122" rx="12" fill="#0e2833" stroke="#365461" stroke-width="1.5"/>
  <rect x="427" y="177" width="260" height="40" rx="8" fill="#143844"/>
  <text x="557" y="204" text-anchor="middle" fill="#eff8fa" font-size="22" font-weight="700">VPN d'accès</text>
  <text x="557" y="247" text-anchor="middle" fill="#b6cbd3" font-size="18">Authentification MFA</text>

  <line x1="707" y1="218" x2="756" y2="218" stroke="#71cede" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="768" y="149" width="358" height="142" rx="12" fill="#0e2833" stroke="#83dbb8" stroke-width="1.8"/>
  <rect x="785" y="167" width="324" height="43" rx="8" fill="#16473f" stroke="#83dbb8" stroke-width="1.1"/>
  <text x="947" y="195" text-anchor="middle" fill="#eff8fa" font-size="23" font-weight="700">Bastion centralisé</text>
  <text x="947" y="238" text-anchor="middle" fill="#eff8fa" font-size="18">Droits par technicien et site</text>
  <text x="947" y="269" text-anchor="middle" fill="#83dbb8" font-size="17">Sessions tracées · Révocation</text>

  <!-- Liaisons intersites. Pas de route directe des utilisateurs aux superviseurs. -->
  <path d="M947 291V358" fill="none" stroke="#71cede" stroke-width="3"/>
  <text x="34" y="337" fill="#71cede" font-size="18" font-weight="700">VPN INTERSITES  ·  PASSERELLES DÉDIÉES</text>
  <path d="M201 358H947" fill="none" stroke="#71cede" stroke-width="3"/>
  <path d="M201 358V405" fill="none" stroke="#83dbb8" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M947 358V405" fill="none" stroke="#83dbb8" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M574 358V389" fill="none" stroke="#edb28f" stroke-width="2.6" stroke-dasharray="7 6"/>
  <path d="M565 396L583 414M583 396L565 414" fill="none" stroke="#edb28f" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Magasin A -->
  <rect x="34" y="425" width="334" height="196" rx="12" fill="#0e2833" stroke="#4b7080" stroke-width="1.5"/>
  <rect x="51" y="442" width="300" height="44" rx="8" fill="#143844"/>
  <text x="201" y="470" text-anchor="middle" fill="#eff8fa" font-size="23" font-weight="700">Magasin A</text>
  <text x="201" y="516" text-anchor="middle" fill="#b6cbd3" font-size="18">Passerelle VPN · Pare-feu</text>
  <path d="M52 539H350" stroke="#365461" stroke-width="1.2"/>
  <text x="201" y="570" text-anchor="middle" fill="#eff8fa" font-size="20">Superviseur frigorifique</text>
  <text x="201" y="602" text-anchor="middle" fill="#83dbb8" font-size="19" font-weight="700">✓ Accès autorisé</text>

  <!-- Magasin B -->
  <rect x="413" y="425" width="334" height="196" rx="12" fill="#0e2833" stroke="#4b7080" stroke-width="1.5"/>
  <rect x="430" y="442" width="300" height="44" rx="8" fill="#143844"/>
  <text x="580" y="470" text-anchor="middle" fill="#eff8fa" font-size="23" font-weight="700">Magasin B</text>
  <text x="580" y="516" text-anchor="middle" fill="#b6cbd3" font-size="18">Passerelle VPN · Pare-feu</text>
  <path d="M431 539H729" stroke="#365461" stroke-width="1.2"/>
  <text x="580" y="570" text-anchor="middle" fill="#eff8fa" font-size="20">Superviseur frigorifique</text>
  <text x="580" y="602" text-anchor="middle" fill="#edb28f" font-size="19" font-weight="700">× Session vers B refusée</text>

  <!-- Magasin C -->
  <rect x="792" y="425" width="334" height="196" rx="12" fill="#0e2833" stroke="#4b7080" stroke-width="1.5"/>
  <rect x="809" y="442" width="300" height="44" rx="8" fill="#143844"/>
  <text x="959" y="470" text-anchor="middle" fill="#eff8fa" font-size="23" font-weight="700">Magasin C</text>
  <text x="959" y="516" text-anchor="middle" fill="#b6cbd3" font-size="18">Passerelle VPN · Pare-feu</text>
  <path d="M810 539H1108" stroke="#365461" stroke-width="1.2"/>
  <text x="959" y="570" text-anchor="middle" fill="#eff8fa" font-size="20">Superviseur frigorifique</text>
  <text x="959" y="602" text-anchor="middle" fill="#83dbb8" font-size="19" font-weight="700">✓ Accès autorisé</text>

  <path d="M34 644H1126" stroke="#365461" stroke-width="1.3"/>
  <text x="580" y="671" text-anchor="middle" fill="#b6cbd3" font-size="16">Pare-feu : flux réseau filtrés · Superviseur : permissions de commande distinctes</text>
  <text x="580" y="691" text-anchor="middle" fill="#8eacb8" font-size="13">Schéma conceptuel lxrider · Habilitations fictives, à adapter à l'architecture réelle</text>
</svg>
