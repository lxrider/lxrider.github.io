<svg baseProfile="full" height="570" version="1.1" viewBox="0 0 1200 570" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Quatre dimensions complémentaires de reprise</title><desc>Vérifier les chemins de communication et alarmes, les paramètres appliqués, l’assainissement des accès et la réalité du fonctionnement frigorifique avant de conclure.</desc><defs><marker id="arrowcyan" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#72d2e8" /></marker><marker id="arrowgreen" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#65d8b7" /></marker><marker id="arrowamber" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#efbc76" /></marker></defs><rect fill="#061523" height="570" width="1200" x="0" y="0" /><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="38" y="45">LE RETOUR DES ÉCRANS NE SUFFIT PAS</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="38" y="75">Quatre dimensions à documenter, sans ordre universel.</text><rect fill="#081e2c" height="154" rx="15" ry="15" stroke="#72d2e8" stroke-width="1.5" width="540" x="48" y="111" /><rect fill="#092535" height="38" rx="7" ry="7" stroke="#72d2e8" stroke-width="1.5" width="52" x="65" y="126" /><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="91" y="152">01</text><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="130" y="154">Liaisons et alertes</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="72" y="187">• Communications nécessaires vérifiées</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="72" y="214">• Réception par l’astreinte confirmée</text><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="72" y="245">Preuve : tests de bout en bout</text><rect fill="#081e2c" height="154" rx="15" ry="15" stroke="#65d8b7" stroke-width="1.5" width="540" x="612" y="111" /><rect fill="#092535" height="38" rx="7" ry="7" stroke="#65d8b7" stroke-width="1.5" width="52" x="629" y="126" /><text fill="#65d8b7" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="655" y="152">02</text><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="694" y="154">Paramètres appliqués</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="636" y="187">• Référence approuvée et relecture</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="636" y="214">• Modes et programmations examinés</text><text fill="#65d8b7" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="636" y="245">Preuve : état actif du régulateur</text><rect fill="#081e2c" height="154" rx="15" ry="15" stroke="#72d2e8" stroke-width="1.5" width="540" x="48" y="289" /><rect fill="#092535" height="38" rx="7" ry="7" stroke="#72d2e8" stroke-width="1.5" width="52" x="65" y="304" /><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="91" y="330">03</text><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="130" y="332">Accès maîtrisés</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="72" y="365">• Comptes et sessions réexaminés</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="72" y="392">• Chemins suspects traités</text><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="72" y="423">Preuve : contrôles et traces</text><rect fill="#081e2c" height="154" rx="15" ry="15" stroke="#efbc76" stroke-width="1.5" width="540" x="612" y="289" /><rect fill="#092535" height="38" rx="7" ry="7" stroke="#efbc76" stroke-width="1.5" width="52" x="629" y="304" /><text fill="#efbc76" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="655" y="330">04</text><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="694" y="332">Froid et exploitation</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="636" y="365">• Mesures et cycles pertinents observés</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="636" y="392">• Protections et denrées évaluées</text><text fill="#efbc76" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="636" y="423">Preuve : validation métier documentée</text><rect fill="#0c2637" height="62" rx="12" ry="12" stroke="#345d6c" stroke-width="1.5" width="1104" x="48" y="473" /><text fill="#efbc76" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="69" y="496">POINT DE VIGILANCE</text><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="69" y="519">Une configuration restaurée peut encore contenir un état anormal ou une action différée.</text></svg>