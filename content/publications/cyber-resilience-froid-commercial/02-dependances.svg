<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="635" version="1.1" viewBox="0 0 1200 635" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Dépendances fonctionnelles du froid commercial</title><desc>Schéma conceptuel : supervision au-dessus de régulateurs locaux et du procédé ; chemin des alarmes distinct ; les fonctions réelles doivent être vérifiées sur site.</desc><defs><marker id="arrowcyan" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#72d2e8" /></marker><marker id="arrowgreen" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#65d8b7" /></marker><marker id="arrowamber" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#efbc76" /></marker></defs><rect fill="#061523" height="635" width="1200" x="0" y="0" /><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="38" y="43">FONCTIONS DISTINCTES, DÉPENDANCES À VÉRIFIER</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="38" y="72">Une supervision indisponible ne démontre pas l’arrêt de la régulation locale.</text><rect fill="#081b2a" height="462" rx="17" ry="17" stroke="#2a596b" stroke-width="1.5" width="765" x="32" y="98" /><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="52" y="129">PILOTAGE ET PROCÉDÉ</text><rect fill="#081e2c" height="89" rx="14" ry="14" stroke="#72d2e8" stroke-width="1.5" width="720" x="54" y="149" /><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="77" y="185">Supervision / GTC</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="77" y="216">Visualisation, historiques et commandes possibles selon les droits</text><line marker-end="url(#arrowamber)" stroke="#efbc76" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="2.6" x1="231" x2="231" y1="238" y2="279" /><line marker-end="url(#arrowamber)" stroke="#efbc76" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="2.6" x1="596" x2="596" y1="238" y2="279" /><rect fill="#081e2c" height="102" rx="14" ry="14" stroke="#65d8b7" stroke-width="1.5" width="344" x="54" y="283" /><rect fill="#081e2c" height="102" rx="14" ry="14" stroke="#65d8b7" stroke-width="1.5" width="344" x="430" y="283" /><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="75" y="321">Régulation de centrale</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="75" y="352">Pilotage local des compresseurs</text><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="450" y="321">Régulation des meubles</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="450" y="352">Sondes, vannes, dégivrages</text><line marker-end="url(#arrowgreen)" stroke="#65d8b7" stroke-linecap="round" stroke-width="2.8" x1="232" x2="232" y1="385" y2="426" /><line marker-end="url(#arrowgreen)" stroke="#65d8b7" stroke-linecap="round" stroke-width="2.8" x1="602" x2="602" y1="385" y2="426" /><rect fill="#0b2b34" height="96" rx="14" ry="14" stroke="#5f9399" stroke-width="1.5" width="720" x="54" y="433" /><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="76" y="469">Procédé frigorifique</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="76" y="499">Centrale, circuit frigorifique, meubles et chambres</text><rect fill="#081b2a" height="462" rx="17" ry="17" stroke="#2a596b" stroke-width="1.5" width="352" x="817" y="98" /><text fill="#72d2e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="838" y="129">CHAÎNE D’ALERTE</text><rect fill="#081e2c" height="94" rx="14" ry="14" stroke="#4f9bb5" stroke-width="1.5" width="310" x="838" y="149" /><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="856" y="184">Détecter</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="856" y="215">Mesure, seuil, temporisation</text><rect fill="#081e2c" height="94" rx="14" ry="14" stroke="#4f9bb5" stroke-width="1.5" width="310" x="838" y="274" /><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="856" y="309">Acheminer</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="856" y="340">Réseau, service, plateforme</text><rect fill="#081e2c" height="94" rx="14" ry="14" stroke="#4f9bb5" stroke-width="1.5" width="310" x="838" y="399" /><text fill="#ecf4f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="856" y="434">Prendre en charge</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="856" y="465">Destinataire, astreinte, action</text><line marker-end="url(#arrowcyan)" stroke="#72d2e8" stroke-linecap="round" stroke-width="2.6" x1="994" x2="994" y1="245" y2="270" /><line marker-end="url(#arrowcyan)" stroke="#72d2e8" stroke-linecap="round" stroke-width="2.6" x1="994" x2="994" y1="370" y2="395" /><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="838" y="519">Cette chaîne peut partager des</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="838" y="539">composants avec la régulation.</text><line stroke="#385c6b" stroke-linecap="round" stroke-width="1" x1="35" x2="1165" y1="580" y2="580" /><text fill="#efbc76" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="40" y="610">Commande possible  ≠  paramètre accepté  ≠  effet physique assuré.</text><text fill="#afc4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" x="1160" y="610">Schéma conceptuel · non contractuel</text></svg>