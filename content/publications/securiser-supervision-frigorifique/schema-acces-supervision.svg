<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-labelledby="title desc"><title id="title">Avant et après : accès à la supervision frigorifique</title><desc id="desc">Avant, la supervision est accessible directement depuis Internet par une redirection NAT. Après, le technicien utilise une connexion privée avec accès limité. Les alarmes sortantes sont conservées si leur mode de transmission le permet et doivent être testées.</desc>
