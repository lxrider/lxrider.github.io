<title id="title">Repérer les menus réseau dans une Livebox 5 et Freebox Connect</title>
<desc id="desc">Repères schématiques originaux, et non captures d'écran. Orange Livebox 5 : Paramètres avancés, Réseau, NAT/PAT. Freebox Connect : Réseau, Paramètres réseau avancés, Redirection de port ou Serveur VPN.</desc>
