# Développement local du site DevLab ; aucun déploiement.
base_url = "https://lxrider.github.io"
title = "lxrider | Recherche en cybersécurité offensive"
description = "Publications indépendantes sur les chemins d’accès, les identités et les systèmes IT/OT."
author = "lxrider"
theme = "devlab-theme"
default_language = "fr"
compile_sass = true
build_search_index = false
generate_feeds = false

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_content = true

[markdown]
insert_anchor_links = "right"

[extra.devlab.brand]
logo_text = ""
footer_text = "lxrider"
show_logo_mark = true
logo_mark_path = "/images/lxrider-header-logo.png"

[extra.devlab.home]
layout = "default"

[extra.devlab.appearance]
default_mode = "dark"
show_toggle = true

[extra.devlab.navigation]
links = [
  { name = "Publications", collection = "publications" },
  { name = "À propos", path = "/a-propos/" },
  { name = "GitHub", path = "https://github.com/lxrider" },
]

[extra.devlab.collections.publications]
section = "publications/_index.md"
title = "Publications"
show_breadcrumbs = true
show_toc = true
show_pagination = false

[extra.devlab.docs.page_actions]
show_last_updated = false
show_copy_link = true

[extra.devlab.search]
enabled = false

[extra.devlab.footer]
show = true
note = "Analyse indépendante des systèmes et de leurs chemins d'accès."
links = []

# DevLab v0.9.0 has EN/DE/RU defaults; only visible local labels translated here.
