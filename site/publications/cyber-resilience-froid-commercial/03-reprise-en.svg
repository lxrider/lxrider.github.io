<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Quatre vérifications de reprise et deux décisions distinctes</title><desc id="chart-desc">Deux colonnes et deux lignes de critères : alertes, paramètres actifs, accès maîtrisés, froid. Retour à l’exploitation et clôture cyber sont distincts.</desc>
