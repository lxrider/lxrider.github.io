<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Dépendances à vérifier avant confinement</title><desc id="chart-desc">Schéma conceptuel en deux panneaux : pilotage frigorifique et parcours des alarmes, avec liaisons possibles à confirmer avant isolement.</desc>
