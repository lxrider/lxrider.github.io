<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Mandat de maintenance et habilitations affichées</title><desc id="svgDesc">Exemple fictif : le technicien intervient sur A ; sa plateforme liste aussi B et C. Les droits de connexion et d’écriture restent à vérifier.</desc>
<rect width="1200" height="570" fill="#061421"/><rect x="10" y="10" width="1180" height="550" rx="18" fill="#061421" stroke="#27465A" stroke-width="1.2"/>
<text x="40" y="59" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#72D2E8" text-anchor="start">MANDAT D’INTERVENTION  /  ACCÈS À VÉRIFIER</text>
<text x="40" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#AFC4CF" text-anchor="start">La plateforme affiche trois magasins ; les droits effectifs restent à établir.</text>
<rect x="35" y="115" width="390" height="324" rx="15" fill="#071B29" stroke="#2A5870" stroke-width="1.4"/>
<rect x="447" y="115" width="718" height="324" rx="15" fill="#071B29" stroke="#2A5870" stroke-width="1.4"/>
<text x="55" y="147" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#72D2E8" text-anchor="start">MANDAT D’INTERVENTION</text>
<text x="467" y="147" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#72D2E8" text-anchor="start">MAGASINS AFFICHÉS DANS LA PLATEFORME</text>
<text x="55" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ECF4F7" text-anchor="start">Technicien de maintenance</text>
<text x="55" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#AFC4CF" text-anchor="start">Mission : magasin A uniquement</text>
<rect x="75" y="244" width="310" height="117" rx="13" fill="#092232" stroke="#65D8B7" stroke-width="1.6"/>
<text x="230" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ECF4F7" text-anchor="middle">Magasin A</text>
<text x="230" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#65D8B7" text-anchor="middle">Intervention autorisée</text>
<text x="230" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#AFC4CF" text-anchor="middle">sur le périmètre prévu</text>
<text x="55" y="399" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#AFC4CF" text-anchor="start">Décision : exploitant / mainteneur</text>
<rect x="477" y="236" width="207" height="125" rx="11" fill="#092232" stroke="#65D8B7" stroke-width="1.6"/>
<text x="580" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ECF4F7" text-anchor="middle">Magasin A</text>
<text x="580" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#65D8B7" text-anchor="middle">Site référencé</text>
<text x="580" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#AFC4CF" text-anchor="middle">Écriture à vérifier</text>
<rect x="704" y="236" width="207" height="125" rx="11" fill="#092232" stroke="#EFBC76" stroke-width="1.6"/>
<text x="807" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ECF4F7" text-anchor="middle">Magasin B</text>
<text x="807" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#EFBC76" text-anchor="middle">Site référencé</text>
<text x="807" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#AFC4CF" text-anchor="middle">Écriture à vérifier</text>
<rect x="931" y="236" width="207" height="125" rx="11" fill="#092232" stroke="#EFBC76" stroke-width="1.6"/>
<text x="1034" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ECF4F7" text-anchor="middle">Magasin C</text>
<text x="1034" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#EFBC76" text-anchor="middle">Site référencé</text>
<text x="1034" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#AFC4CF" text-anchor="middle">Écriture à vérifier</text>
<text x="467" y="193" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#ECF4F7" text-anchor="start">Le compte référence A, B et C. Peut-il y écrire ?</text>
<text x="467" y="402" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#AFC4CF" text-anchor="start">Contrôler les filtres et droits de chaque superviseur.</text>
<rect x="35" y="462" width="1130" height="65" rx="12" fill="#071B29" stroke="#87663F" stroke-width="1.4"/>
<text x="55" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#EFBC76" text-anchor="start">POINT À CONTRÔLER</text>
<text x="55" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#ECF4F7" text-anchor="start">Qui peut réellement se connecter, écrire et retirer ces droits ?</text>
<text x="1160" y="548" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#AFC4CF" text-anchor="end">Exemple fictif · Aucune habilitation réelle constatée</text>
</svg>
