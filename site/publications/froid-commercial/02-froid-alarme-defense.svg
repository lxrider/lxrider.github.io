<path d="M875,300 L972,300" stroke="#69D8E8" stroke-width="2.8" fill="none" stroke-linecap="round" />
<path d="M960.0,293.0 L972,300 L960.0,307.0" stroke="#69D8E8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="435" y="279" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#BAD1D7" text-anchor="start">Données /</text>
<text x="435" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#BAD1D7" text-anchor="start">ordres</text>
<text x="882" y="279" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#BAD1D7" text-anchor="start">Alertes</text>
<text x="60" y="393" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#BAD1D7" text-anchor="start">Une rupture de supervision peut priver le magasin de données ou d’alertes, même si la régulation locale fonctionne.</text>
