<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
<title id="title">Bastion de télémaintenance : accès limités aux supervisions frigorifiques</title>
<desc id="desc">Schéma conceptuel. Le frigoriste identifié rejoint un bastion par une connexion VPN. Le bastion autorise une session vers le superviseur du magasin A, mais bloque l'accès au magasin B lorsque le technicien n'y est pas habilité. Le bastion journalise les connexions, sans modifier les droits d'administration propres au superviseur.</desc>
<defs>
  <marker id="arrow-green" viewBox="0 0 9 9" refX="7.6" refY="4.5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70dbc2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 9 9" refX="7.6" refY="4.5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#95c0d7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1160" height="520" rx="18" fill="#101d2b"/>
<text x="35" y="48" fill="#f3f7f8" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Bastion de télémaintenance</text>
<text x="35" y="80" fill="#a8bdc9" font-family="Arial,Helvetica,sans-serif" font-size="17">EXEMPLE SCHÉMATIQUE · ACCÈS DIFFÉRENCIÉS SELON LES SITES</text>

<!-- Thin separation line, matching the article's other schematics. -->
<path d="M35 102H1125" stroke="#395261" stroke-width="1"/>

<!-- Authorized identity -->
<rect x="36" y="180" width="213" height="148" rx="12" fill="#1a2d3b" stroke="#65818f" stroke-width="1.4"/>
<rect x="54" y="199" width="177" height="43" rx="7" fill="#264354"/>
<text x="142.5" y="226" fill="#ffffff" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Frigoriste</text>
<text x="142.5" y="275" fill="#d4e5ed" font-size="18" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Compte nominatif</text>
<text x="142.5" y="303" fill="#a8bdc9" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Authentification</text>

<!-- Connection -->
<rect x="292" y="180" width="145" height="148" rx="12" fill="#1a2d3b" stroke="#65818f" stroke-width="1.4"/>
<rect x="310" y="199" width="109" height="43" rx="7" fill="#264354"/>
<text x="364.5" y="226" fill="#ffffff" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">VPN</text>
<text x="364.5" y="275" fill="#d4e5ed" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Connexion</text>
<text x="364.5" y="303" fill="#a8bdc9" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">privée</text>

<!-- Bastion -->
<rect x="481" y="165" width="222" height="188" rx="12" fill="#1a2d3b" stroke="#70dbc2" stroke-width="1.9"/>
<rect x="499" y="184" width="186" height="44" rx="7" fill="#16473f" stroke="#70dbc2" stroke-width="1"/>
<text x="592" y="213" fill="#ffffff" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Bastion</text>
<text x="592" y="263" fill="#d4e5ed" font-size="18" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Vérifie les droits</text>
<text x="592" y="294" fill="#d4e5ed" font-size="18" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Limite les accès</text>
<text x="592" y="325" fill="#8ad3c1" font-size="18" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Trace les sessions</text>

<!-- Site boundary -->
<rect x="755" y="125" width="370" height="283" rx="12" fill="none" stroke="#65818f" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="779" y="158" fill="#a8bdc9" font-size="17" font-family="Arial,Helvetica,sans-serif">SUPERVISIONS DES MAGASINS</text>
<rect x="782" y="185" width="313" height="83" rx="10" fill="#16473f" stroke="#70dbc2" stroke-width="1.7"/>
<text x="802" y="216" fill="#f3f7f8" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif">Magasin A</text>
<text x="802" y="244" fill="#d4e5ed" font-size="18" font-family="Arial,Helvetica,sans-serif">Superviseur · accès autorisé</text>
<rect x="782" y="301" width="313" height="83" rx="10" fill="#1a2d3b" stroke="#65818f" stroke-width="1.4"/>
<text x="802" y="333" fill="#f3f7f8" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif">Magasin B</text>
<text x="802" y="361" fill="#d4e5ed" font-size="18" font-family="Arial,Helvetica,sans-serif">Superviseur · accès non accordé</text>

<!-- Access path: left to right -->
<path d="M249 254H283" fill="none" stroke="#95c0d7" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M437 254H472" fill="none" stroke="#95c0d7" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M703 225H774" fill="none" stroke="#70dbc2" stroke-width="3.2" marker-end="url(#arrow-green)"/>
<!-- Explicit denied route. The line terminates at a cross BEFORE the destination. -->
<path d="M703 343H747" fill="none" stroke="#f7b28c" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M748 331L761 344M761 331L748 344" fill="none" stroke="#f7b28c" stroke-width="3.4" stroke-linecap="round"/>

<!-- One operational limit, not an infographic panel -->
<path d="M35 438H1125" stroke="#395261" stroke-width="1"/>
<text x="580" y="470" fill="#d4e5ed" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Le bastion encadre les sessions. Les droits de modification restent ceux du superviseur.</text>
<text x="580" y="500" fill="#a8bdc9" font-size="15" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Schéma original lxrider · Architecture illustrative, à adapter aux équipements et aux accès réels.</text>
</svg>
