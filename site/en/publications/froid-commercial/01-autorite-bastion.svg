<text x="522" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5BC75" text-anchor="start">AUTORITÉ D’ADMINISTRATION</text>
<text x="522" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#ECF5F5" text-anchor="start">Qui attribue les rôles ?</text>
<text x="522" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#ECF5F5" text-anchor="start">Qui modifie les règles ?</text>
<rect x="966" y="480" width="394" height="160" rx="12" fill="#0D2835" stroke="#F5BC75" stroke-width="1.8"/>
<text x="985" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5BC75" text-anchor="start">CHEMIN DE CONTOURNEMENT</text>
<text x="985" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#ECF5F5" text-anchor="start">Accès direct au superviseur ?</text>
<text x="985" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#ECF5F5" text-anchor="start">À rechercher et à bloquer.</text>
