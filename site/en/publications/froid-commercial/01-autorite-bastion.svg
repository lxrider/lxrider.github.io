<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Télémaintenance : portée des accès et frontières de confiance</title><desc id="desc">Une identité de maintenance entre par un VPN avec authentification multifacteur, puis par un bastion qui contrôle les sessions et les destinations ; les droits applicatifs et le régulateur limitent les commandes. Un contournement possible doit être recherché.</desc>
<rect width="1400" height="760" rx="19" fill="#071823"/>
<rect x="2" y="2" width="1396" height="756" rx="17" fill="none" stroke="#355766" stroke-width="2"/>
<text x="40" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#69D8E8" text-anchor="start">FIG. 1  /  AUTORITÉ ET TÉLÉMAINTENANCE</text>
<text x="40" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#ECF5F5" text-anchor="start">Une session autorisée, des capacités à limiter</text>
<text x="40" y="125" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#BAD1D7" text-anchor="start">Exemple d’architecture : les contrôles réels sont à vérifier sur chaque installation.</text>
