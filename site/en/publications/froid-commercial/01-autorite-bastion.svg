<text x="59" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#ECF5F5" text-anchor="start">Le bastion impose le trajet</text>
<text x="59" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#ECF5F5" text-anchor="start">et limite les destinations.</text>
