<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 710" role="img" aria-labelledby="title desc">
<title id="title">From Purdue functions to zones and conduits</title><desc id="desc">Functional map of retailer IT, external contractor access, supervisory system, controllers and alarms, with four controlled communication conduits. This is an illustrative architecture and not a fixed Purdue mapping.</desc>
