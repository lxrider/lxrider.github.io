<rect width="1360" height="710" rx="18" fill="#101d2b"/>
<text x="38" y="51" fill="#f3f7f8" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="29">From Purdue functions to zones and conduits</text>
<text x="38" y="85" fill="#a8bdc9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">CONCEPTUAL EXAMPLE · REFRIGERATION REMOTE ACCESS · NOT A UNIVERSAL TOPOLOGY</text>
<path d="M36 109H1324" stroke="#395261" stroke-width="1.2"/>
<rect x="42" y="185" width="294" height="131" rx="12" fill="#213747" stroke="#95c0d7" stroke-width="1.6"/><text x="189" y="234" fill="#ffffff" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22">External technician</text><text x="189" y="271" fill="#d4e5ed" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17">Authenticated maintenance</text>
<rect x="42" y="399" width="294" height="133" rx="12" fill="#1a2d3b" stroke="#65818f" stroke-width="1.6"/><text x="189" y="443" fill="#f3f7f8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="21">Retailer IT zone</text><text x="189" y="480" fill="#a8bdc9" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Separate trust boundary</text>
<path d="M377 156H1318V556H377Z" stroke="#65818f" stroke-width="1.5" stroke-dasharray="8 7" fill="#152634"/>
<text x="402" y="184" fill="#a8bdc9" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16">REFRIGERATION TECHNICAL PERIMETER</text>
