<text x="680" y="616" fill="#d4e5ed" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">Purdue maps functions. IEC 62443 zones group assets by security requirements and consequences.</text>
<text x="680" y="652" fill="#a8bdc9" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17">Each conduit needs an initiator, destination, purpose, allowed protocol, access control and owner.</text>
