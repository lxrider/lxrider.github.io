<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Independent technical Internet connection</title><desc id="desc">Separation of business IT does not establish the security of the technical connection.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#95c0d7" stroke-width="1.7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#f7b28c" stroke-width="1.7"/></marker></defs><rect width="1200" height="620" rx="18" fill="#101d2b"/><text x="35" y="49" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#f3f7f8">Independent technical Internet connection</text><text x="35" y="80" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#a8bdc9">CANDIDATE ARCHITECTURE · BASED ON FIELD REPORTS</text><path d="M35 100H1165" stroke="#395261"/><rect x="430" y="118" width="340" height="68" rx="12" fill="#264354" stroke="#95c0d7" stroke-width="1.6"/><text x="600" y="161" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#ffffff">Internet</text><path d="M505 186V216H302V278" fill="none" stroke="#95c0d7" stroke-width="3" marker-end="url(#a)"/><path d="M695 186V216H898V278" fill="none" stroke="#f7b28c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#b)"/><rect x="35" y="280" width="530" height="255" rx="12" fill="#182b39" stroke="#65818f" stroke-width="1.6"/><rect x="635" y="280" width="530" height="255" rx="12" fill="#182b39" stroke="#65818f" stroke-width="1.6"/><text x="300" y="313" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a8bdc9">RETAILER NETWORK</text><text x="900" y="313" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a8bdc9">INDEPENDENT TECHNICAL CONNECTION</text><rect x="65" y="332" width="470" height="72" rx="12" fill="#264354" stroke="#95c0d7" stroke-width="1.6"/><text x="300" y="376" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">Retailer IT network</text><rect x="65" y="434" width="470" height="72" rx="12" fill="#182b39" stroke="#65818f" stroke-width="1.6"/><text x="300" y="478" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#f3f7f8">Business systems</text><path d="M300 404V432" fill="none" stroke="#95c0d7" stroke-width="2.6" marker-end="url(#a)"/><rect x="665" y="332" width="470" height="72" rx="12" fill="#26313e" stroke="#f7b28c" stroke-width="1.6"/><text x="900" y="376" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Contractor router / gateway</text><rect x="665" y="434" width="221" height="72" rx="12" fill="#283840" stroke="#f7b28c" stroke-width="1.6"/><text x="775" y="478" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">AK-SM / XWEB</text><rect x="914" y="434" width="221" height="72" rx="12" fill="#173e3c" stroke="#70d8c1" stroke-width="1.6"/><text x="1025" y="478" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">Controllers</text><path d="M900 404V420H775V432" fill="none" stroke="#95c0d7" stroke-width="2.6" marker-end="url(#a)"/><path d="M886 470H913" stroke="#70d8c1" stroke-width="3"/><path d="M567 392H632" stroke="#65818f" stroke-width="2" stroke-dasharray="5 6"/><path d="M588 379L612 405M612 379L588 405" stroke="#f7b28c" stroke-width="2.2"/><text x="600" y="424" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#a8bdc9">No assumed LAN connection</text><text x="600" y="563" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#f4cf9e">Potential inbound access depends on router configuration (e.g. NAT/PAT).</text><text x="600" y="592" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#a8bdc9">Separation of business IT does not establish the security of the technical connection.</text></svg>